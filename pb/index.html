<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pallet Pal</title>
  <!--
    Compatibility redirect. PB Wholesale is now a workspace inside the single
    Pallet Pal application (one login, one shell, a portal switcher in the
    top-right corner). This old address opens that application with the PB
    Wholesale workspace selected. The workspace still has to be available to
    the person signed in; this page grants nothing by itself.
  -->
  <meta http-equiv="refresh" content="0; url=../index.html?workspace=pb-wholesale" />
  <script>
    window.location.replace('../index.html?workspace=pb-wholesale' + window.location.hash);
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2a2a2a; color: #fff; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    a { color: #f57a1f; font-weight: 700; }
  </style>
</head>
<body>
  <p>Opening Pallet Pal&hellip; If nothing happens, <a href="../index.html?workspace=pb-wholesale">continue to Pallet Pal</a>.</p>
</body>
</html>
