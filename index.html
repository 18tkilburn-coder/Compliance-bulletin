<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PER4M Warehouse Hub</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!--
    Portal gate: a simple role selector, not real authentication. A real
    build must replace this with proper staff login (see js/portal.js).
  -->
  <div id="portal-gate" class="portal-gate">
    <div class="portal-gate-rack" aria-hidden="true"></div>
    <div class="portal-gate-inner">
      <div class="portal-gate-mark">PER4M<span class="brand-accent">WAREHOUSE</span></div>
      <p class="portal-gate-tagline">Warehouse Hub</p>
      <p class="portal-gate-stats" id="portal-gate-stats" aria-live="polite"></p>

      <div class="portal-options">
        <button type="button" class="portal-card" data-portal="employee">
          <span class="portal-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 7.5V16.5L12 21l9-4.5V7.5"/><path d="M12 12v9"/></svg>
          </span>
          <span class="portal-card-title">Employee Portal</span>
          <span class="portal-card-desc">Log stock, search, and manage locations.</span>
        </button>
        <button type="button" class="portal-card" data-portal="manager">
          <span class="portal-card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>
          </span>
          <span class="portal-card-title">Manager Portal</span>
          <span class="portal-card-desc">Full access &mdash; manage stock, products, and stock takes.</span>
        </button>
      </div>

      <p class="portal-gate-note">
        Prototype note: this is a simple role selector for the demo &mdash; a real build would replace this with proper staff login.
      </p>
    </div>
  </div>

  <div class="app-shell" id="app-shell" hidden>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">PER4M<span class="brand-accent">WAREHOUSE</span></span>
        <span class="brand-sub">Warehouse Hub</span>
      </div>

      <button type="button" class="command-palette-trigger" id="command-palette-trigger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Quick jump&hellip;</span>
        <kbd>&#8984;K</kbd>
      </button>

      <div class="sidebar-section-label" id="sidebar-role-label">Workspace</div>
      <nav class="tabs" id="tabs"></nav>

      <div class="sidebar-footer">
        <button type="button" class="switch-portal-btn" id="switch-portal-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M21 3 14 10"/><path d="M3 21l7-7"/></svg>
          <span>Switch Portal</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar" id="app-header">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <nav class="breadcrumb" id="breadcrumb" aria-live="polite"></nav>
        <div class="topbar-clock" id="topbar-clock"></div>
      </header>

      <div class="prototype-banner" id="prototype-banner" hidden>
        Prototype &mdash; scanning is simulated for this demo. The final build will use live camera barcode scanning.
      </div>

      <main id="screen-root" class="screen-root" hidden></main>
    </div>
  </div>

  <div class="command-palette-overlay" id="command-palette-overlay" hidden>
    <div class="command-palette">
      <div class="command-palette-input-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="command-palette-input" placeholder="Jump to a screen&hellip;" autocomplete="off" />
        <kbd>Esc</kbd>
      </div>
      <div class="command-palette-list" id="command-palette-list"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/vendor/jsbarcode.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/screens/putaway.js"></script>
  <script src="js/screens/search.js"></script>
  <script src="js/screens/baySearch.js"></script>
  <script src="js/screens/locations.js"></script>
  <script src="js/screens/entryDetail.js"></script>
  <script src="js/screens/manageProducts.js"></script>
  <script src="js/screens/deliveryImport.js"></script>
  <script src="js/screens/barcodeLabels.js"></script>
  <script src="js/screens/palletLabels.js"></script>
  <script src="js/screens/stockTake.js"></script>
  <script src="js/screens/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
