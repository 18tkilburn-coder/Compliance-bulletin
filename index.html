<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PER4M Warehouse | Stock Location Tracker</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">PER4M<span class="brand-accent">WAREHOUSE</span></span>
      <span class="brand-sub">Stock Location Tracker</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-screen="putaway">Put-Away</button>
      <button class="tab-btn" data-screen="search">Search</button>
      <button class="tab-btn" data-screen="locations">All Locations</button>
      <button class="tab-btn" data-screen="products">Manage Products</button>
    </nav>
  </header>

  <div class="prototype-banner">
    Prototype &mdash; scanning is simulated for this demo. The final build will use live camera barcode scanning.
  </div>

  <main id="screen-root" class="screen-root"></main>

  <div id="toast" class="toast" hidden></div>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/screens/putaway.js"></script>
  <script src="js/screens/search.js"></script>
  <script src="js/screens/locations.js"></script>
  <script src="js/screens/entryDetail.js"></script>
  <script src="js/screens/manageProducts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
